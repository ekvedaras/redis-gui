name : Release
on :
  push :
    branches :
      - main
    paths-ignore :
      - '**.md'
      - '**.spec.js'
      - '.idea'
      - '.gitignore'
      - '.github/**'
      - '!.github/workflows/release.yml'

concurrency :
  group : release-${{ github.ref }}
  cancel-in-progress : true


defaults :
  run :
    shell : 'bash'


jobs :

  draft :
    runs-on : ubuntu-latest
    outputs :
      release-note : ${{ steps.release-note.outputs.release-note }}
      version : ${{ steps.version.outputs.build-version }}

    steps :
      - uses : actions/checkout@v5
        with :
          fetch-depth : 0

      - uses : actions/setup-node@v5
        with :
          node-version : 24

      - name : Get last git tag
        id : tag
        run : echo "last-tag=$(git describe --tags --abbrev=0 || git rev-list --max-parents=0 ${{github.ref}})" >> "$GITHUB_OUTPUT"

      - name : Generate release notes
        uses : ./.github/actions/release-notes
        id : release-note
        with :
          from : ${{ steps.tag.outputs.last-tag }}
          to : ${{ github.ref }}
          include-commit-body : true
          include-abbreviated-commit : true

      - name : Get version from current date
        id : version
        run : echo "build-version=$(node -e "try{console.log(require('./.electron-builder.config.js').extraMetadata.version)}catch(e){console.error(e);process.exit(1)}")" >> "$GITHUB_OUTPUT"


      - name : Waiting on All checks
        uses : lewagon/wait-on-check-action@v1.9.1
        with :
          ref : ${{ github.ref }}
          repo-token : ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name : 'draft'
          # Dependabot reports its security updates as a check on the same commit, and a
          # dependency with no safe version yet would otherwise block releasing entirely.
          ignore-checks : Dependabot

      - name : Delete outdated drafts
        uses : hugo19941994/delete-draft-releases@v3.0.0
        env :
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}

      - name : Create Release Draft
        uses : softprops/action-gh-release@v3
        env :
          GITHUB_TOKEN : ${{ secrets.github_token }}
        with :
          prerelease : true
          draft : true
          tag_name : v${{ steps.version.outputs.build-version }}
          name : v${{ steps.version.outputs.build-version }}
          body : ${{ steps.release-note.outputs.release-note }}

  upload_artifacts :
    needs : [ draft ]

    strategy :
      matrix :
        os : [ windows-latest, macos-latest, ubuntu-latest ]

    runs-on : ${{ matrix.os }}

    steps :
      - uses : actions/checkout@v5

      - uses : actions/setup-node@v5
        with :
          node-version : 24
          cache : 'yarn'

      - name : Install dependencies
        run : yarn install --frozen-lockfile

      # The easiest way to transfer release notes to a compiled application is create `release-notes.md` in the build resources.
      # See https://github.com/electron-userland/electron-builder/issues/1511#issuecomment-310160119
      - name : Prepare release notes
        env :
          RELEASE_NOTE : ${{ needs.draft.outputs.release-note }}
        run : echo "$RELEASE_NOTE" >> ./buildResources/release-notes.md

      - name : Install Snapcraft
        uses : samuelmeuli/action-snapcraft@v2
        # Only install Snapcraft on Ubuntu
        if : startsWith(matrix.os, 'ubuntu')

      # Compile app and upload artifacts
      - name : Compile & release Electron app
        run : yarn run build && npx electron-builder --publish always --config .electron-builder.config.js
        env :
          VITE_APP_VERSION : ${{ needs.draft.outputs.version }}
          GH_TOKEN : ${{ secrets.github_token }}
          SNAPCRAFT_STORE_CREDENTIALS : ${{ secrets.snapcraft_token }}
